name: release-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          python -m venv gateway/venv
          gateway/venv/Scripts/python.exe -m pip install -r gateway/requirements.lock.txt
          pnpm --dir reviewer install --frozen-lockfile
          ./Setup.ps1 -Offline -SkipCredentials
      - name: Offline tests and secret checks
        shell: pwsh
        run: |
          . ./scripts/Install-Gitleaks.ps1
          ./Test-Release.ps1

      - name: Dependency vulnerability checks
        shell: pwsh
        run: |
          Push-Location reviewer
          try { pnpm audit --prod; if ($LASTEXITCODE -ne 0) { throw 'Node dependency audit failed.' } } finally { Pop-Location }
          $auditPython=Join-Path $env:RUNNER_TEMP 'dependency-audit/Scripts/python.exe'
          python -m venv (Join-Path $env:RUNNER_TEMP 'dependency-audit')
          & $auditPython -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw 'Audit tool installation failed.' }
          & $auditPython -m pip_audit -r gateway/requirements.lock.txt --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency audit failed.' }
